<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Зона создания нового стикера -->
      <header class="creator-area">
        <textarea
          id="new-sticker-text"
          placeholder="Напишите что-нибудь на новом стикере..."
        ></textarea>
        <button id="add-sticker-btn">📌 Добавить стикер</button>
      </header>

      <!-- Доска, где будут плиткой располагаться стикеры -->
      <main id="stickers-board" class="stickers-board">
        <!-- Сюда JavaScript будет добавлять новые стикеры -->
      </main>
    </div>

    <script src="scriptNew.js?v=1" width="200"></script>
  </body>
