<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Главный контейнер всего блокнота -->
    <div class="notepad-container">
      <!-- Левая панель: Боковое меню для списка заметок -->
      <aside class="sidebar">
        <!-- Сюда позже добавим кнопку и список -->
        <!-- Кнопка для создания новой заметки -->
        <button id="add-note-btn" class="btn-add">➕ Новая заметка</button>

        <!-- Сюда в будущем JavaScript будет добавлять ссылки на заметки -->
        <div id="notes-list" class="notes-list"></div>
      </aside>

      <!-- Правая панель: Зона редактора текста -->
      <main class="editor-area">
        <!-- Сюда позже добавим поле ввода текста -->
        <!-- Поле для ввода заголовка заметки -->
        <input
          type="text"
          id="note-title"
          class="editor-title"
          placeholder="Название заметки..."
          disabled
        />

        <!-- Поле для ввода основного текста -->
        <textarea
          id="note-text"
          class="editor-text"
          placeholder="Начните писать здесь..."
          disabled
        ></textarea>
      </main>
    </div>

    <script src="scriptNew.js?v=1" width="200"></script>
  </body>
</html>
