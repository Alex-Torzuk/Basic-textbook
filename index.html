<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Это главный контейнер, где будет жить весь наш список дел -->
    <div class="todo-container">
      <h1>Мой список дел на сегодня</h1>

      <!-- Сюда мы сейчас будем добавлять элементы ввода -->
      <!-- Блок для ввода нового дела -->
      <div class="todo-input-section">
        <input type="text" id="todo-input" placeholder="Что нужно сделать?" />
        <button id="add-btn">Добавить</button>
      </div>

      <ul id="todo-list">
        <!-- Здесь JavaScript будет создавать элементы списка <li> -->
      </ul>
    </div>

    <script src="scriptNew.js?v=1" width="200"></script>
  </body>
</html>
